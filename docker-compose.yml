services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: bd-proyecto
    environment:
      ACCEPT_EULA: "Y"
      # La clave sale del archivo .env (ver .env.example). Si falta, Docker no arranca.
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Falta MSSQL_SA_PASSWORD en el archivo .env}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
volumes:
  sqldata:
